
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
        }

        .header {
            background: #1e3a8a;
            color: white;
            padding: 20px 40px;
        }

        .header h2 {
            margin: 0;
        }

        .container {
            padding: 35px 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #1e3a8a;
            text-decoration: none;
            font-weight: bold;
        }

        .form-box {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.08);
            max-width: 750px;
            margin: auto;
        }

        .form-box h2 {
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #334155;
        }

        input, select {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
        }

        .submit-area {
            margin-top: 28px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        button:hover {
            background: #1e40af;
        }

        .footer {
            text-align: center;
            color: #64748b;
            padding: 20px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-box {
                padding: 22px;
            }

            .header {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>Student Management System</h2>
    </div>

    <div class="container">

        <a href="/dashboard" class="back">← Back to Dashboard</a>

        <div class="form-box">

            <h2>Student Registration</h2>
            {% if error %}
    <p style="color: red; text-align: center; font-weight: bold;">
        {{ error }}
    </p>
            {% endif %}

            <p class="subtitle">
                Enter the student details to register a new student.
            </p>

            <form action="/students" method="POST">

                <div class="form-grid">

                    <div class="form-group">
                        <label>Student Name</label>
                        <input type="text" name="student_name"
                               placeholder="Enter student name" required>
                    </div>

                    <div class="form-group">
                        <label>Register Number</label>
                        <input type="text" name="register_number"
                               placeholder="Enter register number" required>
                    </div>

                    <div class="form-group">
                        <label>Department</label>
                        <select name="department" required>
                            <option value="">Select Department</option>
                            <option value="MCA">MCA</option>
                            <option value="MBA">MBA</option>
                            <option value="BCA">BCA</option>
                            <option value="B.Sc Computer Science">B.Sc Computer Science</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Year</label>
                        <select name="study_year" required>
                            <option value="">Select Year</option>
                            <option value="1">First Year</option>
                            <option value="2">Second Year</option>
                            <option value="3">Third Year</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" name="email"
                               placeholder="Enter email address" required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" name="phone"
                               placeholder="Enter phone number" required>
                    </div>

                </div>

                <div class="submit-area">
                    <button type="submit">Register Student</button>
                </div>

            </form>

        </div>
    </div>

    <div class="footer">
        Student Attendance & Performance Management System
    </div>

</body>
</html>
