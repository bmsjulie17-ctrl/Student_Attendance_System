
<!DOCTYPE html>
<html>
<head>
    <title>My Attendance</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 30px;
        }

        h1 {
            color: #1e3a8a;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #1e3a8a;
            color: white;
        }

        .back {
            display: inline-block;
            background: #1e3a8a;
            color: white;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>My Attendance</h1>

    <table>
        <tr>
            <th>Date</th>
            <th>Status</th>
        </tr>

        {% for record in attendance_records %}
        <tr>
            <td>{{ record.attendance_date }}</td>
            <td>{{ record.status }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="2">No attendance records found.</td>
        </tr>
        {% endfor %}
    </table>

    <a href="/student_dashboard" class="back">
        Back to Dashboard
    </a>

</body>
</html>
